# Haishoku eza theme. Ordinary text inherits the terminal foreground.
# Actions use function colors, resources use type colors, and values use constants.

filekinds:
  normal:
    foreground: Default
  directory:
    foreground: "#dcbd93"
    is_bold: true
  symlink:
    foreground: "#a8b0b8"
  pipe:
    foreground: "#859099"
  block_device:
    foreground: "#859099"
    is_bold: true
  char_device:
    foreground: "#859099"
    is_bold: true
  socket:
    foreground: "#859099"
  special:
    foreground: "#859099"
  executable:
    foreground: "#dcbd93"
    is_bold: true
  mount_point:
    foreground: "#dcbd93"
    is_bold: true

# Readable data, mutation modifiers, and executable actions have distinct roles.
perms:
  user_read:
    foreground: "#a8bcac"
    is_bold: true
  user_write:
    foreground: "#b3a6b0"
    is_bold: true
  user_execute_file:
    foreground: "#dcbd93"
    is_bold: true
  user_execute_other:
    foreground: "#dcbd93"
    is_bold: true
  group_read:
    foreground: "#a8bcac"
  group_write:
    foreground: "#b3a6b0"
  group_execute:
    foreground: "#dcbd93"
  other_read:
    foreground: "#a8bcac"
  other_write:
    foreground: "#b3a6b0"
  other_execute:
    foreground: "#dcbd93"
  special_user_file:
    foreground: "#dcbd93"
    is_bold: true
  special_other:
    foreground: "#dcbd93"
  attribute:
    foreground: "#a8b0b8"

# All numeric sizes are constants; units remain secondary text.
size:
  number_byte:
    foreground: "#cca598"
  number_kilo:
    foreground: "#cca598"
  number_mega:
    foreground: "#cca598"
  number_giga:
    foreground: "#cca598"
    is_bold: true
  number_huge:
    foreground: "#cca598"
    is_bold: true
  unit_byte:
    foreground: "#6f6f6b"
  unit_kilo:
    foreground: "#6f6f6b"
  unit_mega:
    foreground: "#6f6f6b"
  unit_giga:
    foreground: "#6f6f6b"
  unit_huge:
    foreground: "#6f6f6b"

users:
  user_you:
    foreground: Default
    is_bold: true
  user_root:
    foreground: "#dcbd93"
    is_bold: true
  user_other:
    foreground: Default
  group_yours:
    foreground: "#d7d7c6"
  group_other:
    foreground: "#d7d7c6"
  group_root:
    foreground: "#dcbd93"

links:
  normal:
    foreground: "#cca598"
  multi_link_file:
    foreground: "#cca598"

# Match Haishoku's added, changed, deleted, and diagnostic colors.
git:
  new:
    foreground: "#a8bcac"
  modified:
    foreground: "#a8b0b8"
  deleted:
    foreground: "#cca598"
  renamed:
    foreground: "#a8b0b8"
  ignored:
    foreground: "#6f6f6b"
  conflicted:
    foreground: "#cca598"
    is_bold: true

git_repo:
  branch_main:
    foreground: "#a8b0b8"
    is_bold: true
  branch_other:
    foreground: "#a8b0b8"
  git_clean:
    foreground: "#a8bcac"
  git_dirty:
    foreground: "#dcbd93"

# Classify content by role rather than assigning each format an arbitrary hue.
file_type:
  image:
    foreground: "#93a5a0"
  video:
    foreground: "#93a5a0"
  music:
    foreground: "#93a5a0"
  crypto:
    foreground: "#93a5a0"
    is_bold: true
  document:
    foreground: "#a8bcac"
  compressed:
    foreground: "#cca598"
  temp:
    foreground: "#6f6f6b"
    is_italic: true
  compiled:
    foreground: "#cca598"
  build:
    foreground: "#dcbd93"
    is_bold: true
    is_underline: true
  source:
    foreground: "#93a5a0"

punctuation:
  foreground: "#acaca2"

date:
  foreground: "#cca598"

inode:
  foreground: "#cca598"

blocks:
  foreground: "#cca598"

header:
  foreground: "#dcbd93"
  is_bold: true

octal:
  foreground: "#cca598"

flags:
  foreground: "#b3a6b0"

control_char:
  foreground: "#cca598"

broken_symlink:
  foreground: "#cca598"
  is_bold: true

broken_path_overlay:
  foreground: "#cca598"

security_context:
  none:
    foreground: Default
  selinux:
    colon:
      foreground: "#acaca2"
    user:
      foreground: Default
    role:
      foreground: "#a8b0b8"
    typ:
      foreground: "#93a5a0"
    range:
      foreground: "#cca598"
